name: Build & Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux manylinux
          - runner: ubuntu-22.04
            target: x86_64
            rid: linux-x64
            manylinux: manylinux_2_34
          # - runner: ubuntu-22.04 # disabled: lz c dep doesn't build
          #   target: aarch64
          #   rid: linux-arm64
          #   manylinux: manylinux_2_34
          # # Linux musllinux # disabled: dotnet still references glibc
          # - runner: ubuntu-22.04
          #   target: x86_64
          #   rid: linux-musl-x64
          #   manylinux: musllinux_1_2
          # - runner: ubuntu-22.04
          #   target: aarch64
          #   rid: linux-musl-arm64
          #   manylinux: musllinux_1_2
          # Windows
          - runner: windows-latest
            target: x64
            rid: win-x64
            manylinux: ""
          # MacOS
          - runner: macos-15-intel
            target: x86_64
            rid: osx-x64
            manylinux: ""
          - runner: macos-15
            target: aarch64
            rid: osx-arm64
            manylinux: ""
    steps:
      - uses: actions/checkout@v7

      - name: Build bindings
        run: cargo build --release -p bindings
      - name: Check generated C# bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code bindings/dotnet/UnitySceneRepacker.Bindings/NativeMethods.g.cs
      - name: Copy artifacts
        shell: bash # todo: replace this with --artifact-dir when finally stable
        run: |
          mkdir out
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/unityscenerepacker.dll out/unityscenerepacker.dll
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp target/release/libunityscenerepacker.dylib out/libunityscenerepacker.dylib
          else
            cp target/release/libunityscenerepacker.so out/libunityscenerepacker.so
          fi

      - name: Upload bindings
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.rid }}
          path: out/*

      - name: Build cli wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.rid }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  nuget:
    name: Build & Publish nuget package
    # for lipo
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: out

      - name: Merge macOS libraries into a universal binary
        run: |
          mkdir out/bindings-osx
          lipo -create out/bindings-osx-x64/libunityscenerepacker.dylib out/bindings-osx-arm64/libunityscenerepacker.dylib -output out/bindings-osx/libunityscenerepacker.dylib

      - name: List built files
        run: ls -R out

      - name: Pack NuGet package
        run: dotnet pack bindings/dotnet/UnitySceneRepacker.Bindings -c Release -p:Version=${GITHUB_REF_NAME#v} -o .

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push unityscenerepacker.*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  release:
    name: Build & Publish PyPI wheels
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [build, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "wheels-*/*"
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v10.3.3
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish --trusted-publishing always wheels-*/*
