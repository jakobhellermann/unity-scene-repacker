[package]
name = "bindings"
edition.workspace = true
# the nuget package version, released on its own when this changes on main
version = "5.3.0"

[lib]
name = "unityscenerepacker"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
indexmap = "2.9"
json5 = "1.3"
unity-scene-repacker = { version = "3.0", path = ".." }
rabex = { workspace = true, default-features = false, features = ["embed-tpk", "compression-lz4"] }
rabex-env.workspace = true
rabex-convert.workspace = true
memmap2 = "0.9"

[build-dependencies]
csbindgen = "1.9"
